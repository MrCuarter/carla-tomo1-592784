<title>Antes de que llegaras · Cuentos de Carla</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--mesa:#2A2724;--papel:#FAF6EE;--tinta:#EDE7DC;--suave:#9A9186;--linea:#443F39}
*{box-sizing:border-box}
body{margin:0;background:var(--mesa);overflow:hidden}
#app{height:100dvh;background:var(--mesa);color:var(--tinta);
  font:400 15px/1.5 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none}
header{padding:14px 18px 10px;text-align:center;flex:0 0 auto}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.01em}
header p{margin:3px 0 0;font-size:12px;color:var(--suave)}
#escena{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  padding:0 14px;min-height:0}
#libro{position:relative;display:flex;perspective:2600px;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
.hoja{position:relative;background:var(--papel);overflow:hidden;flex:0 0 auto}
.hoja img{width:100%;height:100%;display:block;object-fit:cover}
#lomo{position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.20) 44%,
  rgba(0,0,0,.28) 50%,rgba(0,0,0,.20) 56%,rgba(0,0,0,0) 100%);
  pointer-events:none;z-index:6}
#gira{position:absolute;top:0;z-index:8;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.42,0,.35,1);will-change:transform;
  pointer-events:none;visibility:hidden}
#gira .cara{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
  background:var(--papel)}
#gira .cara img{width:100%;height:100%;display:block;object-fit:cover}
#gira .dorso{transform:rotateY(180deg)}
#gira .sombra{position:absolute;inset:0;background:rgba(0,0,0,.30);opacity:0;
  transition:opacity .62s;pointer-events:none}
nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
button{background:transparent;color:var(--tinta);border:1px solid var(--linea);
  border-radius:999px;padding:9px 16px;font:500 14px Archivo,sans-serif;cursor:pointer}
button:hover:not(:disabled){border-color:var(--suave)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:2px solid #7FB0DC;outline-offset:2px}
#donde{font:500 13px/1 Archivo,sans-serif;color:var(--suave);min-width:8ch;
  text-align:center;font-variant-numeric:tabular-nums}
#indice{position:fixed;inset:auto 0 0 0;background:#211E1C;border-top:1px solid var(--linea);
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  transform:translateY(101%);transition:transform .3s;z-index:20;max-height:52vh;overflow:auto}
#indice.abierto{transform:none}
#indice button{font-size:13px;padding:8px 13px}
#pista{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
  background:rgba(0,0,0,.6);border-radius:999px;padding:7px 15px;font-size:12.5px;
  color:var(--tinta);transition:opacity .5s;pointer-events:none}
@media (max-width:700px){ #lomo{display:none} }
@media (prefers-reduced-motion:reduce){
  #gira{transition-duration:.01ms} #gira .sombra{transition-duration:.01ms}
}
</style>
</head>

<div id="escena">

</div>

"img/p193.jpg?v=202609081819"];
const AUTONOMA = false;
const src = i => AUTONOMA ? FUENTES[i] : FUENTES[i];

const libro = document.getElementById('libro');
const izq = document.querySelector('#izq img');
const der = document.querySelector('#der img');
const gira = document.getElementById('gira');
const frente = document.querySelector('#gira .frente img');
const dorso = document.querySelector('#gira .dorso img');
const sombras = document.querySelectorAll('#gira .sombra');
const donde = document.getElementById('donde');
const bAtras = document.getElementById('atras');
const bAlante = document.getElementById('alante');
const pista = document.getElementById('pista');
const indice = document.getElementById('indice');

let i = 0;              // índice de la página izquierda
let doble = true;       // dos páginas o una
let animando = false;

function mide() {
  const escena = document.getElementById('escena');
  doble = window.innerWidth >= 700;
  const dispAlto = escena.clientHeight - 8;
  const dispAncho = escena.clientWidth - 8;
  const lado = Math.floor(Math.min(dispAlto, dispAncho / (doble ? 2 : 1)));
  for (const h of document.querySelectorAll('.hoja')) {
    h.style.width = lado + 'px'; h.style.height = lado + 'px';
  }
  document.getElementById('der').style.display = doble ? 'block' : 'none';
  gira.style.width = lado + 'px';
  gira.style.height = lado + 'px';
  gira.style.left = doble ? lado + 'px' : '0px';
  gira.style.transformOrigin = 'left center';
  avisa();
  pinta();
}

let tPista = null;
function avisa() {
  const vertical = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
  pista.textContent = (!doble && vertical)
      ? 'Gira el móvil para ver el libro abierto. Toca o desliza para pasar página.'
      : 'Desliza o usa las flechas';
  pista.style.opacity = 1;
  clearTimeout(tPista);
  tPista = setTimeout(() => pista.style.opacity = 0, (!doble && vertical) ? 6000 : 3800);
}

function pinta() {
  if (doble && i % 2) i--;
  izq.src = src(i) || '';
  if (doble) der.src = src(i + 1) || '';
  const total = FUENTES.length;
  const hasta = doble ? Math.min(i + 2, total) : i + 1;
  donde.textContent = (doble && i + 1 < total)
      ? `${i + 1}–${hasta} / ${total}` : `${i + 1} / ${total}`;
  bAtras.disabled = i <= 0;
  bAlante.disabled = i >= total - (doble ? 2 : 1);
}

function pasa(dir) {
  const salto = doble ? 2 : 1;
  const destino = i + dir * salto;
  if (animando || destino < 0 || destino > FUENTES.length - salto) return;
  if (!doble) { i = destino; pinta(); return; }
  animando = true;
  if (dir > 0) {
    frente.src = src(i + 1) || '';
    dorso.src = src(i + 2) || '';
    gira.style.transition = 'none';
    gira.style.transform = 'rotateY(0deg)';
    gira.style.visibility = 'visible';
    requestAnimationFrame(() => {
      gira.style.transition = '';
      gira.style.transform = 'rotateY(-180deg)';
      sombras[0].style.opacity = 1;
    });
  } else {
    frente.src = src(i - 1) || '';
    dorso.src = src(i) || '';
    gira.style.transition = 'none';
    gira.style.transform = 'rotateY(-180deg)';
    gira.style.visibility = 'visible';
    sombras[0].style.opacity = 1;
    requestAnimationFrame(() => {
      gira.style.transition = '';
      gira.style.transform = 'rotateY(0deg)';
      sombras[0].style.opacity = 0;
    });
  }
  setTimeout(() => {
    i = destino;
    pinta();
    gira.style.visibility = 'hidden';
    sombras.forEach(s => s.style.opacity = 0);
    animando = false;
  }, 620);
}

bAlante.addEventListener('click', () => pasa(1));
bAtras.addEventListener('click', () => pasa(-1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); pasa(1); }
  if (e.key === 'ArrowLeft') pasa(-1);
  if (e.key === 'Escape') indice.classList.remove('abierto');
});
let ignoraClic = false;
libro.addEventListener('click', e => {
  if (ignoraClic) return;
  const r = libro.getBoundingClientRect();
  pasa(e.clientX - r.left > r.width / 2 ? 1 : -1);
});

let x0 = null;
libro.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
libro.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) { pasa(dx < 0 ? 1 : -1); ignoraClic = true; setTimeout(() => ignoraClic = false, 500); }
  x0 = null;
}, {passive:true});

document.getElementById('verIndice').addEventListener('click',
  () => indice.classList.toggle('abierto'));
indice.addEventListener('click', e => {
  const b = e.target.closest('button[data-p]');
  if (!b) return;
  i = parseInt(b.dataset.p, 10);
  if (doble && i % 2) i--;
  pinta();
  indice.classList.remove('abierto');
});

window.addEventListener('resize', mide);
window.addEventListener('load', mide);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(mide);
// Dentro del visor de artefactos el marco puede medir 0 al arrancar y crecer después.
if (window.ResizeObserver) new ResizeObserver(mide).observe(document.getElementById('escena'));
(function espera(n) {
  mide();
  if (document.getElementById('escena').clientHeight < 40 && n < 60) setTimeout(() => espera(n + 1), 100);
})(0);

</script>
